<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="viarmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#viarmsGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="4" />

  <!-- Shopping bag icon / POS device symbol -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Bag handles -->
    <path d="M 90 140 C 90 70, 210 70, 210 140" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Bag body -->
    <path d="M 40 140 L 260 140 L 285 340 C 285 365, 265 385, 240 385 L 60 385 C 35 385, 15 365, 15 340 Z" 
          fill="rgba(15, 23, 42, 0.75)" stroke="url(#neonCyan)" stroke-width="20" stroke-linejoin="round" />
    
    <!-- Barcode lines inside bag -->
    <g transform="translate(75, 210)" fill="#38bdf8">
      <rect x="0" y="0" width="10" height="85" rx="4"/>
      <rect x="18" y="0" width="16" height="85" rx="4"/>
      <rect x="42" y="0" width="8" height="85" rx="4"/>
      <rect x="58" y="0" width="22" height="85" rx="4"/>
      <rect x="88" y="0" width="12" height="85" rx="4"/>
      <rect x="108" y="0" width="18" height="85" rx="4"/>
      <rect x="134" y="0" width="10" height="85" rx="4"/>
    </g>
  </g>
</svg>
